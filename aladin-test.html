<!doctype html><html><head><meta charset="utf-8"><title>Aladin A/B test</title>
<style>body{background:#0b0f16;color:#dfe7f3;font-family:sans-serif} .row{display:flex;gap:16px} .cell{flex:1} .box{height:380px;border:1px solid #345;border-radius:10px;overflow:hidden;background:#000}</style></head>
<body>
<h1>Aladin A/B test</h1>
<div class="row">
  <div class="cell"><h2>A — SPHEREx cube (IRSA)</h2><div class="box" id="box-a"></div></div>
  <div class="cell"><h2>B — DSS2 colour (CDS)</h2><div class="box" id="box-b"></div></div>
</div>
<script type="module">
  const A = (await import("https://cdn.jsdelivr.net/npm/aladin-lite@3.8.2/dist/aladin.js")).default;
  await A.init;
  A.aladin("#box-a", { survey: "https://irsa.ipac.caltech.edu/data/hips/SPHEREx/spherex_allsky_cube", fov: 0.35, target: "269.4464 4.7671", showSettingsControl: false });
  A.aladin("#box-b", { survey: "P/DSS2/color", fov: 0.35, target: "269.4464 4.7671", showSettingsControl: false });
  document.title = "BOTH CREATED";
</script>
</body></html>
